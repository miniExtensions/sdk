name: SDK CI evidence recovery

on:
    pull_request:

permissions:
    contents: read

jobs:
    recover:
        name: Recover existing CI153 evidence
        if: github.repository == 'miniExtensions/sdk' && github.event.pull_request.number == 155 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/pr153-controlled-comparison'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            actions: read
        steps:
            - name: Checkout recovery source only
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false
            - name: Verify original artifact and export compact analysis
              env:
                  SDK_RECOVERY_GITHUB_TOKEN: ${{ github.token }}
                  SDK_RECOVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: python3 -I .github/scripts/ci153-recover.py "$RUNNER_TEMP/sdk-ci153-recovery-export"
            - name: Check bounded export readiness
              id: export
              if: always()
              run: |
                  if test -f "$RUNNER_TEMP/sdk-ci153-recovery-export-upload-ready.json"; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Retain compact recovery evidence
              if: always() && steps.export.outputs.ready == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-ci153-recovery-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-ci153-recovery-export/
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 6
                  archive: true
                  overwrite: false
                  include-hidden-files: false
