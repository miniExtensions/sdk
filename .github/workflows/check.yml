name: Package checks

on:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: check (24)
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Checkout diagnostic harness
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: sdk-comparison/control
                  persist-credentials: false
            - name: Checkout A1 exact EA9
              uses: actions/checkout@v4
              with:
                  ref: ea9f16e4e08d62a1f66a93d9a77f8ef5e93148f9
                  path: sdk-comparison/samples/A1
                  persist-credentials: false
            - name: Checkout B1 exact PR153
              uses: actions/checkout@v4
              with:
                  ref: faac6a701dae92bb92a69e3fcd1e43b917d181b0
                  path: sdk-comparison/samples/B1
                  persist-credentials: false
            - name: Checkout B2 exact PR153
              uses: actions/checkout@v4
              with:
                  ref: faac6a701dae92bb92a69e3fcd1e43b917d181b0
                  path: sdk-comparison/samples/B2
                  persist-credentials: false
            - name: Checkout A2 exact EA9
              uses: actions/checkout@v4
              with:
                  ref: ea9f16e4e08d62a1f66a93d9a77f8ef5e93148f9
                  path: sdk-comparison/samples/A2
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install --global pnpm@10.28.2
            - name: Controlled A1 B1 B2 A2 full validation
              run: node "$GITHUB_WORKSPACE/sdk-comparison/control/.github/scripts/ci153-comparison.mjs" "$GITHUB_WORKSPACE/sdk-comparison/samples" "$RUNNER_TEMP/sdk-ci153-comparison"
            - name: Retain controlled comparison and failure evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-ci153-controlled-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-ci153-comparison/
                  if-no-files-found: warn
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
