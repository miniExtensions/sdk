name: Package checks

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: check (24)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install --global pnpm@10.28.2
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
              env:
                  SDK_CHECKED_ARTIFACT_DIR: ${{ runner.temp }}/sdk-tested-customer-kit
                  SDK_BROWSER_PROOF_ARTIFACT_DIR: ${{ runner.temp }}/sdk-synthetic-browser-proof
                  SDK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            - name: Verify runner-provided Chrome
              run: google-chrome --version
            - name: Retain unit, component, and combined source coverage
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-source-coverage-node-24-attempt-${{ github.run_attempt }}
                  path: |
                      coverage/source-metrics.json
                      coverage/*/coverage-summary.json
                      coverage/*/coverage-final.json
                      coverage/*/lcov.info
                      coverage/*/lcov-report/
                  if-no-files-found: error
                  retention-days: 7
            - name: Execute packed native Chromium proof
              timeout-minutes: 10
              run: pnpm check:browser
              env:
                  SDK_NATIVE_PACKAGE_DIR: ${{ runner.temp }}/sdk-tested-customer-kit
                  SDK_NATIVE_PROOF_DIR: ${{ runner.temp }}/sdk-synthetic-browser-proof
                  SDK_NATIVE_RESULT_DIR: ${{ runner.temp }}/sdk-native-browser-results
            - name: Execute packed Linked Records Chromium proof
              timeout-minutes: 3
              run: node scripts/check-linked-records-browser.mjs "${{ runner.temp }}/sdk-native-browser-results/linked-records"
              env:
                  SDK_LINKED_RECORDS_CHROMIUM: /usr/bin/google-chrome
            - name: Retain native Chromium receipt and failure evidence
              if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-native-browser-results-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-native-browser-results/
                  if-no-files-found: warn
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
            - name: Retain tested customer package
              if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-tested-customer-kit-node-24-attempt-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/sdk-tested-customer-kit/*.tgz
                      ${{ runner.temp }}/sdk-tested-customer-kit/SHA256SUMS
                      ${{ runner.temp }}/sdk-tested-customer-kit/artifact-receipt.json
                      ${{ runner.temp }}/sdk-tested-customer-kit/miniExtensions-SDK-INSTALL.md
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
            - name: Retain synthetic manual browser fixture
              if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-synthetic-browser-proof-node-24-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-synthetic-browser-proof/
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
            - name: Remove local customer delivery files
              if: always()
              env:
                  SDK_CHECKED_ARTIFACT_DIR: ${{ runner.temp }}/sdk-tested-customer-kit
                  SDK_BROWSER_PROOF_ARTIFACT_DIR: ${{ runner.temp }}/sdk-synthetic-browser-proof
                  SDK_NATIVE_RESULT_DIR: ${{ runner.temp }}/sdk-native-browser-results
              run: |
                  node -e "const fs = require('node:fs'); for (const key of ['SDK_CHECKED_ARTIFACT_DIR', 'SDK_BROWSER_PROOF_ARTIFACT_DIR', 'SDK_NATIVE_RESULT_DIR']) { fs.rmSync(process.env[key], { recursive: true, force: true }); if (fs.existsSync(process.env[key])) process.exit(1); } console.log('Customer delivery and synthetic browser fixture outputs removed');"
