name: Package checks

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install --global pnpm@10.28.2
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
              env:
                  SDK_CHECKED_ARTIFACT_DIR: ${{ runner.temp }}/sdk-tested-customer-kit
                  SDK_BROWSER_PROOF_ARTIFACT_DIR: ${{ runner.temp }}/sdk-synthetic-browser-proof
                  SDK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            - name: Retain tested customer package
              if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-tested-customer-kit-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/sdk-tested-customer-kit/*.tgz
                      ${{ runner.temp }}/sdk-tested-customer-kit/SHA256SUMS
                      ${{ runner.temp }}/sdk-tested-customer-kit/artifact-receipt.json
                      ${{ runner.temp }}/sdk-tested-customer-kit/miniExtensions-SDK-INSTALL.md
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
            - name: Retain synthetic manual browser fixture
              if: success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-synthetic-browser-proof-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-synthetic-browser-proof/
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
                  archive: true
                  overwrite: false
                  include-hidden-files: false
            - name: Remove local customer delivery files
              if: always()
              env:
                  SDK_CHECKED_ARTIFACT_DIR: ${{ runner.temp }}/sdk-tested-customer-kit
                  SDK_BROWSER_PROOF_ARTIFACT_DIR: ${{ runner.temp }}/sdk-synthetic-browser-proof
              run: |
                  node -e "const fs = require('node:fs'); for (const key of ['SDK_CHECKED_ARTIFACT_DIR', 'SDK_BROWSER_PROOF_ARTIFACT_DIR']) { fs.rmSync(process.env[key], { recursive: true, force: true }); if (fs.existsSync(process.env[key])) process.exit(1); } console.log('Customer delivery and synthetic browser fixture outputs removed');"
