name: Observer churn validation (temporary)
on:
    pull_request:
permissions:
    contents: read
jobs:
    churn:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install --global pnpm@10.28.2
            - run: pnpm install --frozen-lockfile
            - name: Exercise real observer suites during source workload
              run: |
                  set -euo pipefail
                  source_dir="$RUNNER_TEMP/sdk-source-churn"
                  mkdir -p "$source_dir"
                  tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./coverage' -cf - . | tar -xf - -C "$source_dir"
                  cp -a node_modules "$source_dir/node_modules"
                  (cd "$source_dir" && pnpm format:check && pnpm typecheck && pnpm test) > "$RUNNER_TEMP/sdk-source-churn.log" 2>&1 &
                  source_pid=$!
                  failed=0
                  set +e
                  for round in 1 2 3; do
                      if ! kill -0 "$source_pid" 2>/dev/null; then
                          echo "Source workload did not overlap round $round"
                          failed=1
                      fi
                      echo "Starting observer validation round $round at $(date -u +%FT%TZ)"
                      node --test scripts/package-checks.test.mjs scripts/runtime-cors-check.test.mjs scripts/module-format-checks.test.mjs
                      status=$?
                      echo "Observer validation round $round exit: $status at $(date -u +%FT%TZ)"
                      if [ "$status" -ne 0 ]; then failed=1; fi
                  done
                  wait "$source_pid"
                  source_status=$?
                  set -e
                  cat "$RUNNER_TEMP/sdk-source-churn.log"
                  echo "Source workload exit: $source_status"
                  if [ "$source_status" -ne 0 ] || [ "$failed" -ne 0 ]; then exit 1; fi
