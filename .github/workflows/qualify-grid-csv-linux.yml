name: Grid CSV Linux proof

on:
    pull_request:
        types: [synchronize]
        paths:
            - '.github/workflows/qualify-grid-csv-linux.yml'

permissions:
    contents: read

jobs:
    installed-linux:
        name: Verify the installed Grid CSV filename in Linux Chromium
        if: github.event.pull_request.number == 509 && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 18
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 2
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Enforce 48-hour npm release cutoff
              run: node scripts/npm-release-age.mjs --github-env "$GITHUB_ENV"
            - run: npm install --global pnpm@10.28.2
            - run: pnpm install --frozen-lockfile
            - name: Qualify the installed CSV download with React 18 and 19
              shell: bash
              env:
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  test "$(uname -s)" = Linux
                  checkout="$(git rev-parse HEAD)"
                  test "$checkout" = "$GITHUB_SHA"
                  test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
                  tree="$(git rev-parse HEAD^{tree})"
                  archive_dir="$(mktemp -d "$RUNNER_TEMP/sdk-csv-archive.XXXXXX")"
                  trap 'rm -rf -- "$archive_dir"' EXIT
                  pnpm pack --pack-destination "$archive_dir"
                  shopt -s nullglob
                  archives=("$archive_dir"/*.tgz)
                  test "${#archives[@]}" -eq 1
                  archive="${archives[0]}"
                  digest="$(sha256sum -- "$archive" | cut -d ' ' -f 1)"
                  chrome="$(realpath -- /usr/bin/google-chrome)"
                  "$chrome" --version
                  report_dir="$RUNNER_TEMP/sdk-grid-csv-linux-proof"
                  node scripts/check-readonly-portal-grid-csv-download.mjs \
                    --archive "$archive" --sha256 "$digest" \
                    --output "$report_dir" --chromium "$chrome"
                  jq -e '.profiles | length == 2 and all(.status == "passed" and .download.suggestedFilename == "Synthetic Grid.csv")' "$report_dir/report.json"
                  jq -n --arg checkout "$checkout" --arg tree "$tree" --arg head "$PR_HEAD" \
                    --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg digest "$digest" \
                    '{checkout:$checkout, tree:$tree, head:$head, run:$run, attempt:$attempt, sha256:$digest}' \
                    > "$report_dir/qualification.json"
                  cp -- "$archive" "$report_dir/"
            - name: Retain browser report and tested archive
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: grid-csv-linux-proof-attempt-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/sdk-grid-csv-linux-proof/
                  if-no-files-found: warn
                  retention-days: 7
                  compression-level: 0
            - name: Clean retained runner files
              if: always()
              run: |
                  rm -rf -- "$RUNNER_TEMP/sdk-grid-csv-linux-proof"
                  test ! -e "$RUNNER_TEMP/sdk-grid-csv-linux-proof"
