name: Source failure gate validation (temporary)
on:
    pull_request:
permissions:
    contents: read
jobs:
    source:
        name: source (24)
        runs-on: ubuntu-latest
        steps:
            - run: echo 'Intentional source failure' && exit 1
    package:
        name: package (24)
        permissions:
            contents: read
            actions: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Run actual source gate against failed job
              run: node scripts/wait-for-source-ci.mjs
              env:
                  GH_TOKEN: ${{ github.token }}
                  SDK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            - name: This must not execute
              run: echo 'UNEXPECTED publication step'
    check:
        name: check (24)
        needs: [source, package]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Require both jobs to succeed
              env:
                  SOURCE_RESULT: ${{ needs.source.result }}
                  PACKAGE_RESULT: ${{ needs.package.result }}
              run: |
                  echo "source=$SOURCE_RESULT package=$PACKAGE_RESULT"
                  test "$SOURCE_RESULT" = success && test "$PACKAGE_RESULT" = success
